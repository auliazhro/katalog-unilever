<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Resmi Unilever Indonesia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>Unilever Indonesia Official Shop</h1>
      <p>Katalog Produk Perawatan Diri, Kebersihan, dan Kebutuhan Rumah Tangga</p>
      <a href="https://shopee.co.id/unileverindonesiaofficial" target="_blank" class="btn-shopee">
        🛍️ Kunjungi Lapak Shopee Resmi
      </a>
    </div>
  </header>

  <main class="container">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Cari nama produk atau kategori (misal: Lux, Pepsodent, Rinso, Vaseline)...">
    </div>

    <div id="productGrid" class="product-grid">
      <div class="loading">Memuat katalog produk Unilever...</div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
